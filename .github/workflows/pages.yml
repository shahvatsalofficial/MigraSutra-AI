name: Pages
on:
  push:
    branches: [main]
    paths: ['documents/MigraSutra-AI/**', 'llms.txt', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm run check:docs
      - name: Assemble site
        run: |
          BASE=https://shahvatsalofficial.github.io/MigraSutra-AI
          mkdir _site
          cp -r documents/MigraSutra-AI/. _site/
          cp _site/README.html _site/index.html
          cp llms.txt _site/llms.txt
          printf 'User-agent: *\nAllow: /\nSitemap: %s/sitemap.xml\n' "$BASE" > _site/robots.txt
          { echo '<?xml version="1.0" encoding="UTF-8"?><urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
            echo "<url><loc>$BASE/</loc></url>"
            for f in _site/*.html; do n=$(basename "$f"); [ "$n" = index.html ] || [ "$n" = README.html ] || echo "<url><loc>$BASE/$n</loc></url>"; done
            echo '</urlset>'; } > _site/sitemap.xml
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
