name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: '22' }
          - { os: ubuntu-latest, node: '24' }
          - { os: windows-latest, node: '22' }
          - { os: windows-latest, node: '24' }
          - { os: macos-latest, node: '24' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run doctor
      - run: npm run demo
      - run: node packages/cli/index.mjs audit --root fixtures/risky-app --target node:22 --out artifacts/audit
      - run: npm run check:docs
      - run: npm pack --dry-run
      - uses: actions/upload-artifact@v4
        if: matrix.node == '24'
        with:
          name: audit-${{ matrix.os }}
          path: artifacts/audit
